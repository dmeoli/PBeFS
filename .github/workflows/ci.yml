# --------------------------------------------------------------------------- #
#    Continuous integration of PBeFS                                          #
#                                                                             #
#    Every push and pull request builds the library, the examples, the tools  #
#    and the tester, and runs the tests, both with CMake and with the         #
#    makefiles, with g++ and with clang++ on Linux, macOS (Apple clang and    #
#    the g++ of Homebrew) and Windows (the g++ and the clang++ of MSYS2), and #
#    with CMake and MSVC on Windows; on Linux once more under                 #
#    AddressSanitizer + UndefinedBehaviorSanitizer and under ThreadSanitizer, #
#    which checks the synchronization of the shared-memory searches, and in   #
#    Debug with the line coverage sent to Coveralls. The tests run once more  #
#    with each set of data structures of A* (ADS, std and Boost, see          #
#    PBEFS_STRUCTURES), one runner per set, in Release and then under         #
#    AddressSanitizer + UndefinedBehaviorSanitizer, with the preconditions of #
#    ADS checked. On every system the installed package is used by            #
#    packaging/test, through find_package(PBeFS) and, where pkg-config is,    #
#    through pbefs.pc. Sylvan, for the symbolic searches, is downloaded by    #
#    CMake in every CMake job (and instrumented with the tests under the      #
#    sanitizers), and installed for the makefiles on Linux and macOS; on      #
#    Windows the makefiles build without it, which checks that its absence    #
#    leaves out the symbolic searches and their tests.                        #
#                                                                             #
#    The C++20 module pbefs is built and installed by CMake with clang++,     #
#    with g++ 15 and with the LLVM of macOS, its test run, and its interface  #
#    checked against the one that its script writes.                          #
#                                                                             #
#    On a pull request, the lines that it changes are checked in the style of #
#    the repository code-style, whose action posts the changes that put them  #
#    there as suggestions on them.                                            #
#                                                                             #
#                                Donato Meoli                                 #
#                         Dipartimento di Informatica                         #
#                             Università di Pisa                              #
# --------------------------------------------------------------------------- #
name: CI

on:
  push:
  pull_request:

jobs:
  # the lines that a pull request changes, in the style of the repository
  # code-style, with the changes that put them there posted as suggestions
  style:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dmeoli/code-style@v1

  # CMake with g++ and clang++ on the three systems: on macOS Apple clang
  # with the OpenMP runtime of LLVM, and the g++ of Homebrew; on Windows the
  # g++ and the clang++ of MSYS2 (UCRT64 and CLANG64), without FastFlow,
  # which relies on POSIX, and without MPI
  cmake:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux g++, os: ubuntu-24.04, cxx: g++ }
          - { name: Linux clang++, os: ubuntu-24.04, cxx: clang++ }
          - { name: macOS clang++, os: macos-latest, cxx: clang++ }
          - { name: macOS g++, os: macos-latest, cxx: g++ }
          - { name: Windows g++, os: windows-latest, cxx: g++,
              msys: UCRT64, msyspkg: "gcc libgomp" }
          - { name: Windows clang++, os: windows-latest, cxx: clang++,
              msys: CLANG64, msyspkg: "clang llvm-openmp" }
    defaults:
      run:
        shell: ${{ matrix.msys && 'msys2 {0}' || 'bash' }}
    steps:
      # FastFlow is not installed: CMake downloads it
      - uses: actions/checkout@v4
      # the checkout has no tags: the commit takes the version of the recipes,
      # as in a release, which packaging/test asks of the installed package
      - name: Version
        shell: bash
        run: git tag -f "v$(sed -n 's/^pkgver=//p' packaging/aur/PKGBUILD)"
      # Highway gives the prefetch of ADS [see PBEFS_WITH_HIGHWAY]
      - name: Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenmpi-dev openmpi-bin libomp-dev \
              libhwy-dev
      - name: Dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install open-mpi libomp gcc
      - name: Dependencies (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msys }}
          update: true
          install: git
          pacboy: ${{ matrix.msyspkg }} cmake ninja pkgconf
      # the compiler: the g++ of Homebrew on macOS (g++ is Apple clang there),
      # which Open MPI takes too
      - name: Compiler
        run: |
          c=${{ matrix.cxx }}
          if [ "$RUNNER_OS" = macOS ] && [ "$c" = g++ ]; then
            c=$(ls "$(brew --prefix gcc)"/bin/g++-* | grep -E 'g\+\+-[0-9]+$' |
                sort -V | tail -1)
          fi
          echo "CXX=$c" >> "$GITHUB_ENV"
          echo "OMPI_CXX=$c" >> "$GITHUB_ENV"
          echo "PREFIX=$(cygpath -m "$RUNNER_TEMP" 2>/dev/null ||
                         echo "$RUNNER_TEMP")/pbefs" >> "$GITHUB_ENV"
      - name: Configure
        run: |
          o=
          case "$RUNNER_OS" in
            macOS) o="-DOpenMP_ROOT=$(brew --prefix libomp)" ;;
            Windows) o="-G Ninja -DPBEFS_WITH_FASTFLOW=OFF"
                     o="$o -DPBEFS_WITH_MPI=OFF" ;;
          esac
          cmake --preset gnu -S . -B build -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_CXX_COMPILER="$CXX" $o
      # the units of the benchmarks of B&B and MOA take up to 7 GB each with
      # g++, and the runners have 16 GB (7 on macOS): those one at a time,
      # then the others, of up to 4.5 GB, 3 at a time (2 on macOS)
      - name: Build
        run: |
          cmake --build build --target help > build/targets.txt
          for t in MOABench BranchAndBoundBench BranchAndBoundBenchMPI; do
            if grep -qw "$t" build/targets.txt; then
              cmake --build build -j 1 --target "$t"
            fi
          done
          cmake --build build -j ${{ runner.os == 'macOS' && 2 || 3 }}
      - name: Test
        run: ctest --test-dir build -L PBeFS --output-on-failure
      # the installed package is used by packaging/test
      - name: Install
        run: |
          cmake --install build --prefix "$PREFIX"
          test -f "$PREFIX/lib/cmake/PBeFS/PBeFSConfig.cmake"
          o=
          [ "$RUNNER_OS" = Windows ] && o="-G Ninja"
          [ "$RUNNER_OS" = macOS ] && o="-DOpenMP_ROOT=$(brew --prefix libomp)"
          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"
          PKG_CONFIG_PATH="$PKG_CONFIG_PATH:$PREFIX/share/pkgconfig"
          cmake -S packaging/test \
               -B build-use -DCMAKE_PREFIX_PATH="$PREFIX" \
               -DCMAKE_CXX_COMPILER="$CXX" $o
          cmake --build build-use
          ctest --test-dir build-use --output-on-failure

  structures:
    name: Linux structures ${{ matrix.structures }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        structures: [ std, boost, ads ]
    steps:
      # ADS is not installed: CMake downloads it
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenmpi-dev openmpi-bin libboost-dev
      - name: Configure
        run: >
          cmake --preset gnu -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DPBEFS_STRUCTURES=${{ matrix.structures }}
      # as in the job cmake above
      - name: Build
        run: |
          cmake --build build --target help > build/targets.txt
          for t in MOABench BranchAndBoundBench BranchAndBoundBenchMPI; do
            if grep -qw "$t" build/targets.txt; then
              cmake --build build -j 1 --target "$t"
            fi
          done
          cmake --build build -j 3
      - name: Test
        run: ctest --test-dir build -L PBeFS --output-on-failure
      # the same set under ASan and UBSan, with the preconditions of ADS
      # checked (ADS_CONTRACTS=1: its invariants, at 3, check whole
      # structures at each operation, and the 15-puzzle takes more than the
      # timeout of 900 s), and without MPI, whose library is not
      # instrumented; two units at a time, as in the job sanitizers
      - name: Sanitizers
        env:
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/test/lsan.supp
          UBSAN_OPTIONS: halt_on_error=1 print_stacktrace=1
          PBEFS_TEST_LIGHT: 1
        run: |
          f="-fsanitize=address,undefined -fno-omit-frame-pointer"
          cmake --preset gnu -S . -B build-san \
                -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                -DPBEFS_STRUCTURES=${{ matrix.structures }} \
                -DPBEFS_WITH_MPI=OFF -DPBEFS_BUILD_TOOLS=OFF \
                -DCMAKE_CXX_FLAGS="$f -DADS_CONTRACTS=1" \
                -DCMAKE_C_FLAGS="$f" \
                -DCMAKE_EXE_LINKER_FLAGS="$f"
          cmake --build build-san -j 2
          ctest --test-dir build-san -L PBeFS --output-on-failure

  # the makefiles with g++ and clang++ on the same three systems, ADS and
  # FastFlow taken from ADSSDR and FF_ROOT at the commits that CMake
  # downloads (FastFlow not on Windows), and the cases with MPI where Open
  # MPI is
  makefiles:
    name: ${{ matrix.name }} makefiles
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux g++, os: ubuntu-24.04, cxx: g++ }
          - { name: Linux clang++, os: ubuntu-24.04, cxx: clang++ }
          - { name: macOS clang++, os: macos-latest, cxx: clang++,
              mk: "PBeFSPLATFORM=macos" }
          - { name: macOS g++, os: macos-latest, cxx: g++,
              mk: "PBeFSPLATFORM=macos OMP_SW=-fopenmp OMP_LIB=-fopenmp" }
          - { name: Windows g++, os: windows-latest, cxx: g++,
              msys: UCRT64, msyspkg: "gcc libgomp",
              mk: "PBeFSPLATFORM=win" }
          - { name: Windows clang++, os: windows-latest, cxx: clang++,
              msys: CLANG64, msyspkg: "clang llvm-openmp",
              mk: "PBeFSPLATFORM=win" }
    defaults:
      run:
        shell: ${{ matrix.msys && 'msys2 {0}' || 'bash' }}
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenmpi-dev openmpi-bin libomp-dev
      - name: Dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install open-mpi libomp gcc
      - name: Dependencies (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msys }}
          update: true
          install: make git
          pacboy: ${{ matrix.msyspkg }}
      - name: Compiler
        run: |
          c=${{ matrix.cxx }}
          if [ "$RUNNER_OS" = macOS ] && [ "$c" = g++ ]; then
            c=$(ls "$(brew --prefix gcc)"/bin/g++-* | grep -E 'g\+\+-[0-9]+$' |
                sort -V | tail -1)
          fi
          echo "CXX=$c" >> "$GITHUB_ENV"
          echo "OMPI_CXX=$c" >> "$GITHUB_ENV"
          echo "PREFIX=$RUNNER_TEMP/pbefs" >> "$GITHUB_ENV"
      - name: ADS
        run: |
          c=$(sed -n 's/^pbefs_pin(PBEFS_ADS_COMMIT \([0-9a-f]*\)$/\1/p' \
              CMakeLists.txt)
          git clone -q https://github.com/dmeoli/ADS.git "$RUNNER_TEMP/ads"
          git -C "$RUNNER_TEMP/ads" checkout -q "$c"
          echo "ADSSDR=$RUNNER_TEMP/ads" >> "$GITHUB_ENV"
      - name: FastFlow
        if: runner.os != 'Windows'
        run: |
          c=$(sed -n 's/^pbefs_pin(PBEFS_FASTFLOW_COMMIT \([0-9a-f]*\)$/\1/p' \
              CMakeLists.txt)
          git clone -q https://github.com/fastflow/fastflow.git \
              "$RUNNER_TEMP/fastflow"
          git -C "$RUNNER_TEMP/fastflow" checkout -q "$c"
          echo "FF_ROOT=$RUNNER_TEMP/fastflow" >> "$GITHUB_ENV"
      # Sylvan, with the Lace it downloads, built by CMake at the commit
      # that CMake downloads, and installed in SYLVAN_ROOT
      - name: Sylvan
        if: runner.os != 'Windows'
        run: |
          c=$(sed -n 's/^pbefs_pin(PBEFS_SYLVAN_COMMIT \([0-9a-f]*\)$/\1/p' \
              CMakeLists.txt)
          git clone -q https://github.com/trolando/sylvan.git \
              "$RUNNER_TEMP/sylvan-src"
          git -C "$RUNNER_TEMP/sylvan-src" checkout -q "$c"
          cmake -S "$RUNNER_TEMP/sylvan-src" -B "$RUNNER_TEMP/sylvan-build" \
                -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_LIBDIR=lib \
                -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/sylvan" \
                -DSYLVAN_BUILD_TESTS=OFF -DSYLVAN_BUILD_EXAMPLES=OFF \
                -DSYLVAN_BUILD_CPP=OFF
          cmake --build "$RUNNER_TEMP/sylvan-build" -j 4
          cmake --install "$RUNNER_TEMP/sylvan-build"
          echo "SYLVAN_ROOT=$RUNNER_TEMP/sylvan" >> "$GITHUB_ENV"
      # two units at a time on macOS, as in the job cmake
      - name: Build
        run: >
          make -j ${{ runner.os == 'macOS' && 2 || 4 }} CC="$CXX"
          ${{ matrix.mk }}
      - name: Test
        run: make test CC="$CXX" ${{ matrix.mk }}
      - name: Test MPI
        if: runner.os != 'Windows'
        run: |
          make -C tools mpi -j 2 CC="$CXX" ${{ matrix.mk }}
          make test_mpi CC="$CXX" ${{ matrix.mk }}
      # the targets of the GNUmakefile at the root
      - name: Install
        run: |
          make install PREFIX="$PREFIX" CC="$CXX" ${{ matrix.mk }}
          test -f "$PREFIX/lib/libPBeFS.a"
          test -f "$PREFIX/include/PBeFS/PBeFS.h"

  sanitizers:
    name: Linux ${{ matrix.sanitizer }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # ASan and UBSan on all the cases but MPI, whose library is not
          # instrumented
          - sanitizer: address
            flags: -fsanitize=address,undefined -fno-omit-frame-pointer
            cflags: -fsanitize=address,undefined -fno-omit-frame-pointer
            tests: -E mpi
          # TSan on the searches of the C++ threads and of FastFlow: the
          # OpenMP runtime of gcc is not instrumented, and would give false
          # positives
          # (and Lace, the scheduler of Sylvan, with its fences, which gcc
          # does not instrument and warns of)
          - sanitizer: thread
            flags: -fsanitize=thread
            cflags: -fsanitize=thread -Wno-tsan
            tests: -R "thread|fastflow|limits"
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake --preset gnu -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DPBEFS_WITH_MPI=OFF -DPBEFS_BUILD_TOOLS=OFF
          -DCMAKE_CXX_FLAGS="${{ matrix.flags }}"
          -DCMAKE_C_FLAGS="${{ matrix.cflags }}"
          -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.flags }}"
      # two units at a time: one of the tester takes up to 7 GB under the
      # sanitizers, and the runner has 16 GB
      - name: Build
        run: cmake --build build -j 2
      - name: Test
        env:
          # the lock-free queues of FastFlow and a leak of its blocking mode
          # are suppressed [see the files]
          TSAN_OPTIONS: >-
            halt_on_error=1 second_deadlock_stack=1
            suppressions=${{ github.workspace }}/test/tsan.supp
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/test/lsan.supp
          UBSAN_OPTIONS: halt_on_error=1 print_stacktrace=1
          PBEFS_TEST_LIGHT: 1
        run: >
          ctest --test-dir build -L PBeFS --output-on-failure
          ${{ matrix.tests }}

  # the line coverage of the tests, in Debug and without the sanitizers,
  # sent to Coveralls; without the benchmark tools, which no test runs and
  # whose link in Debug runs the runner out of memory
  coverage:
    name: Linux coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenmpi-dev openmpi-bin lcov
      - name: Configure
        run: >
          cmake --preset gnu -S . -B build -DCMAKE_BUILD_TYPE=Debug
          -DPBEFS_BUILD_TOOLS=OFF
          -DCMAKE_CXX_FLAGS="-O0 -g --coverage"
          -DCMAKE_EXE_LINKER_FLAGS="--coverage"
          -DCMAKE_SHARED_LINKER_FLAGS="--coverage"
      # two jobs: without optimization a unit of the tester takes up to
      # about 6 GB, and the runner has 16 GB
      - name: Build
        run: cmake --build build -j 2
      - name: Test
        run: ctest --test-dir build -L PBeFS --output-on-failure
      - name: Coverage
        run: |
          lcov --capture --directory build --output-file lcov.info \
               --ignore-errors mismatch,inconsistent,unused,negative
          lcov --extract lcov.info "$PWD/include/*" "$PWD/src/*" \
               --output-file lcov.info --ignore-errors unused
      - uses: coverallsapp/github-action@v2
        with:
          file: lcov.info
          fail-on-error: false

  windows:
    name: Windows MSVC
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # the checkout has no tags: the commit takes the version of the recipes,
      # as in a release, which packaging/test asks of the installed package
      - name: Version
        shell: bash
        run: git tag -f "v$(sed -n 's/^pkgver=//p' packaging/aur/PKGBUILD)"
      # FastFlow relies on POSIX, and MPI is left out: the threads and OpenMP
      - name: Configure
        run: >
          cmake --preset msvc -S . -B build -DPBEFS_WITH_FASTFLOW=OFF
          -DPBEFS_WITH_MPI=OFF
      - name: Build
        run: cmake --build build --config Release -j 4
      - name: Test
        run: >
          ctest --test-dir build -C Release -L PBeFS --output-on-failure
      - name: Install
        shell: bash
        run: |
          p="$RUNNER_TEMP/astar"
          cmake --install build --config Release --prefix "$p"
          # the pkg-config of the runner, if any, is not one for MSVC
          cmake -S packaging/test -B build-use -DCMAKE_PREFIX_PATH="$p" \
                -DCMAKE_DISABLE_FIND_PACKAGE_PkgConfig=ON
          cmake --build build-use --config Release
          ctest --test-dir build-use -C Release --output-on-failure

  # the interface of the module the one that cmake/pbefs_module_exports.py
  # writes from the headers, read by clang with MPI, Boost and the symbolic
  # searches, whose headers need no header of Sylvan; on a difference the
  # interface written here is kept as an artifact
  module-interface:
    name: Linux module interface
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libopenmpi-dev libboost-dev
      - name: ADS
        run: |
          c=$(sed -n 's/^pbefs_pin(PBEFS_ADS_COMMIT \([0-9a-f]*\)$/\1/p' \
              CMakeLists.txt)
          git clone -q https://github.com/dmeoli/ADS.git "$RUNNER_TEMP/ads"
          git -C "$RUNNER_TEMP/ads" checkout -q "$c"
      - name: Check the interface
        run: |
          python3 cmake/pbefs_module_exports.py --clang clang++ \
                  --output "$RUNNER_TEMP/PBeFS.cppm" -- \
                  -I"$RUNNER_TEMP/ads/include" -DADS_WITH_MPI \
                  $(mpicxx --showme:compile) -DPBEFS_HAS_SYLVAN
          diff -u src/PBeFS.cppm "$RUNNER_TEMP/PBeFS.cppm"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: PBeFS.cppm
          path: ${{ runner.temp }}/PBeFS.cppm

  # the module by CMake, its test and its installation: a build where
  # PBEFS_BUILD_MODULE was turned off fails, as does one where ctest finds
  # no test of the module; GCC 15, which the runners lack, from its image
  module-cmake:
    name: ${{ matrix.name }} module
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux clang++, os: ubuntu-24.04, cxx: clang++ }
          - { name: Linux g++ 15, os: ubuntu-24.04, cxx: g++,
              image: "gcc:15" }
          - { name: macOS LLVM, os: macos-latest, cxx: llvm }
    steps:
      - uses: actions/checkout@v4
      - name: Ninja and clang-scan-deps
        if: runner.os == 'Linux' && !matrix.image
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang clang-tools
      - name: CMake and Ninja in the image of GCC
        if: matrix.image
        run: |
          apt-get update
          apt-get install -y cmake ninja-build
      - name: Ninja and LLVM
        if: runner.os == 'macOS'
        run: |
          brew install ninja llvm
          llvm=$(brew --prefix llvm)
          echo "CXX=$llvm/bin/clang++" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$llvm/lib/c++ -Wl,-rpath,$llvm/lib/c++" \
               >> "$GITHUB_ENV"
      - name: Compiler
        if: runner.os == 'Linux'
        run: echo "CXX=${{ matrix.cxx }}" >> "$GITHUB_ENV"
      - name: The module and its test
        shell: bash
        run: |
          set -o pipefail
          git config --global --add safe.directory "$PWD"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DPBEFS_BUILD_MODULE=ON -DPBEFS_BUILD_EXAMPLES=OFF \
                -DPBEFS_BUILD_TOOLS=OFF \
                -DCMAKE_INSTALL_PREFIX="$PWD/inst" 2>&1 | tee cmake.log
          ! grep -q 'PBEFS_BUILD_MODULE is turned OFF' cmake.log
          cmake --build build --target PBeFS_module_test
          ctest --test-dir build -R '^PBeFS\.module$' --no-tests=error \
                --output-on-failure
      - name: Install
        shell: bash
        run: |
          # all the targets, since the install rules of the Lace that
          # Sylvan downloads take libraries the module does not link
          cmake --build build
          cmake --install build
          test -f inst/include/PBeFS/modules/PBeFS.cppm
          ls inst/lib*/cmake/PBeFS/PBeFSModuleTargets.cmake
