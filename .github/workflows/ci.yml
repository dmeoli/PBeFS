# --------------------------------------------------------------------------- #
#    Continuous integration of PBeFS                                          #
#                                                                             #
#    Every push and pull request builds the library, the examples, the tools  #
#    and the tester, and runs the tests, both with CMake and with the         #
#    makefiles, with g++ and with clang++ on Linux, macOS (Apple clang and    #
#    the g++ of Homebrew) and Windows (the g++ and the clang++ of MSYS2),     #
#    and with CMake and MSVC on Windows; on Linux once more under             #
#    AddressSanitizer + UndefinedBehaviorSanitizer and under                  #
#    ThreadSanitizer, which checks the synchronization of the shared-memory   #
#    searches, and in Debug with the line coverage sent to Coveralls. The     #
#    tests run once more with each of the other sets of data structures of    #
#    A* (std, Boost and ADS, see PBEFS_STRUCTURES), one runner per set, in    #
#    Release and then under AddressSanitizer + UndefinedBehaviorSanitizer,    #
#    with the preconditions of ADS checked. On every system the installed     #
#    package is used by packaging/test, through find_package(PBeFS) and,      #
#    where pkg-config is, through pbefs.pc.                                   #
#                                                                             #
#                                Donato Meoli                                 #
#                         Dipartimento di Informatica                         #
#                             Universita' di Pisa                             #
# --------------------------------------------------------------------------- #
name: CI

on:
  push:
  pull_request:

jobs:
  # CMake with g++ and clang++ on the three systems: on macOS Apple clang
  # with the OpenMP runtime of LLVM, and the g++ of Homebrew; on Windows the
  # g++ and the clang++ of MSYS2 (UCRT64 and CLANG64), without FastFlow,
  # which relies on POSIX, and without MPI
  cmake:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux g++, os: ubuntu-24.04, cxx: g++ }
          - { name: Linux clang++, os: ubuntu-24.04, cxx: clang++ }
          - { name: macOS clang++, os: macos-latest, cxx: clang++ }
          - { name: macOS g++, os: macos-latest, cxx: g++ }
          - { name: Windows g++, os: windows-latest, cxx: g++,
              msys: UCRT64, msyspkg: gcc }
          - { name: Windows clang++, os: windows-latest, cxx: clang++,
              msys: CLANG64, msyspkg: "clang openmp" }
    defaults:
      run:
        shell: ${{ matrix.msys && 'msys2 {0}' || 'bash' }}
    steps:
      # FastFlow is not installed: CMake downloads it
      - uses: actions/checkout@v4
      # the checkout has no tags: the commit takes the version of the recipes,
      # as in a release, which packaging/test asks of the installed package
      - name: Version
        shell: bash
        run: git tag -f "v$(sed -n 's/^pkgver=//p' packaging/aur/PKGBUILD)"
      - name: Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenmpi-dev openmpi-bin libomp-dev
      - name: Dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install open-mpi libomp gcc
      - name: Dependencies (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msys }}
          update: true
          pacboy: ${{ matrix.msyspkg }} cmake ninja pkgconf
      # the compiler: the g++ of Homebrew on macOS (g++ is Apple clang there),
      # which Open MPI takes too
      - name: Compiler
        run: |
          c=${{ matrix.cxx }}
          if [ "$RUNNER_OS" = macOS ] && [ "$c" = g++ ]; then
            c=$(ls "$(brew --prefix gcc)"/bin/g++-* | grep -E 'g\+\+-[0-9]+$' |
                sort -V | tail -1)
          fi
          echo "CXX=$c" >> "$GITHUB_ENV"
          echo "OMPI_CXX=$c" >> "$GITHUB_ENV"
          echo "PREFIX=$(cygpath -m "$RUNNER_TEMP" 2>/dev/null ||
                         echo "$RUNNER_TEMP")/pbefs" >> "$GITHUB_ENV"
      - name: Configure
        run: |
          o=
          case "$RUNNER_OS" in
            macOS) o="-DOpenMP_ROOT=$(brew --prefix libomp)" ;;
            Windows) o="-G Ninja -DPBEFS_WITH_FASTFLOW=OFF"
                     o="$o -DPBEFS_WITH_MPI=OFF" ;;
          esac
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_CXX_COMPILER="$CXX" $o
      - name: Build
        run: cmake --build build -j 4
      - name: Test
        run: ctest --test-dir build -L PBeFS --output-on-failure
      # the installed package is used by packaging/test
      - name: Install
        run: |
          cmake --install build --prefix "$PREFIX"
          test -f "$PREFIX/lib/cmake/PBeFS/PBeFSConfig.cmake"
          o=
          [ "$RUNNER_OS" = Windows ] && o="-G Ninja"
          [ "$RUNNER_OS" = macOS ] && o="-DOpenMP_ROOT=$(brew --prefix libomp)"
          PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig" cmake -S packaging/test \
               -B build-use -DCMAKE_PREFIX_PATH="$PREFIX" \
               -DCMAKE_CXX_COMPILER="$CXX" $o
          cmake --build build-use
          ctest --test-dir build-use --output-on-failure

  structures:
    name: Linux structures ${{ matrix.structures }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        structures: [ std, boost, ads ]
    steps:
      # ADS is not installed: CMake downloads it
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenmpi-dev openmpi-bin libboost-dev
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DPBEFS_STRUCTURES=${{ matrix.structures }}
      - name: Build
        run: cmake --build build -j 4
      - name: Test
        run: ctest --test-dir build -L PBeFS --output-on-failure
      # the same set under ASan and UBSan, with the preconditions of ADS
      # checked (ADS_CONTRACTS=1: its invariants, at 3, check whole
      # structures at each operation, and the 15-puzzle takes more than the
      # timeout of 900 s), and without MPI, whose library is not
      # instrumented
      - name: Sanitizers
        env:
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/test/lsan.supp
          UBSAN_OPTIONS: halt_on_error=1 print_stacktrace=1
        run: |
          f="-fsanitize=address,undefined -fno-omit-frame-pointer"
          cmake -S . -B build-san -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                -DPBEFS_STRUCTURES=${{ matrix.structures }} \
                -DPBEFS_WITH_MPI=OFF -DPBEFS_BUILD_TOOLS=OFF \
                -DCMAKE_CXX_FLAGS="$f -DADS_CONTRACTS=1" \
                -DCMAKE_EXE_LINKER_FLAGS="$f"
          cmake --build build-san -j 4
          ctest --test-dir build-san -L PBeFS --output-on-failure

  # the makefiles with g++ and clang++ on the same three systems, FastFlow
  # taken from FF_ROOT at the commit that CMake downloads (not on Windows),
  # and the cases with MPI where Open MPI is
  makefiles:
    name: ${{ matrix.name }} makefiles
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux g++, os: ubuntu-24.04, cxx: g++ }
          - { name: Linux clang++, os: ubuntu-24.04, cxx: clang++ }
          - { name: macOS clang++, os: macos-latest, cxx: clang++ }
          - { name: macOS g++, os: macos-latest, cxx: g++ }
          - { name: Windows g++, os: windows-latest, cxx: g++,
              msys: UCRT64, msyspkg: gcc }
          - { name: Windows clang++, os: windows-latest, cxx: clang++,
              msys: CLANG64, msyspkg: "clang openmp" }
    defaults:
      run:
        shell: ${{ matrix.msys && 'msys2 {0}' || 'bash' }}
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenmpi-dev openmpi-bin libomp-dev
      - name: Dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install open-mpi libomp gcc
      - name: Dependencies (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msys }}
          update: true
          install: make git
          pacboy: ${{ matrix.msyspkg }}
      - name: Compiler
        run: |
          c=${{ matrix.cxx }}
          if [ "$RUNNER_OS" = macOS ] && [ "$c" = g++ ]; then
            c=$(ls "$(brew --prefix gcc)"/bin/g++-* | grep -E 'g\+\+-[0-9]+$' |
                sort -V | tail -1)
          fi
          echo "CXX=$c" >> "$GITHUB_ENV"
          echo "OMPI_CXX=$c" >> "$GITHUB_ENV"
          echo "PREFIX=$RUNNER_TEMP/pbefs" >> "$GITHUB_ENV"
      - name: FastFlow
        if: runner.os != 'Windows'
        run: |
          c=$(sed -n 's/^pbefs_pin(PBEFS_FASTFLOW_COMMIT \([0-9a-f]*\)$/\1/p' \
              CMakeLists.txt)
          git clone -q https://github.com/fastflow/fastflow.git \
              "$RUNNER_TEMP/fastflow"
          git -C "$RUNNER_TEMP/fastflow" checkout -q "$c"
          echo "FF_ROOT=$RUNNER_TEMP/fastflow" >> "$GITHUB_ENV"
      - name: Build
        run: make -j 4 CC="$CXX"
      - name: Test
        run: make test CC="$CXX"
      - name: Test MPI
        if: runner.os != 'Windows'
        run: |
          make -C tools mpi -j 2 CC="$CXX"
          make test_mpi CC="$CXX"
      # the targets of the GNUmakefile at the root
      - name: Install
        run: |
          make install PREFIX="$PREFIX" CC="$CXX"
          test -f "$PREFIX/lib/libPBeFS.a"
          test -f "$PREFIX/include/PBeFS/PBeFS.h"

  sanitizers:
    name: Linux ${{ matrix.sanitizer }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # ASan and UBSan on all the cases but MPI, whose library is not
          # instrumented
          - sanitizer: address
            flags: -fsanitize=address,undefined -fno-omit-frame-pointer
            tests: -E mpi
          # TSan on the searches of the C++ threads and of FastFlow: the
          # OpenMP runtime of gcc is not instrumented, and would give false
          # positives
          - sanitizer: thread
            flags: -fsanitize=thread
            tests: -R "thread|fastflow|limits"
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DPBEFS_WITH_MPI=OFF -DPBEFS_BUILD_TOOLS=OFF
          -DCMAKE_CXX_FLAGS="${{ matrix.flags }}"
          -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.flags }}"
      - name: Build
        run: cmake --build build -j 4
      - name: Test
        env:
          # the lock-free queues of FastFlow and a leak of its blocking mode
          # are suppressed [see the files]
          TSAN_OPTIONS: >-
            halt_on_error=1 second_deadlock_stack=1
            suppressions=${{ github.workspace }}/test/tsan.supp
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/test/lsan.supp
          UBSAN_OPTIONS: halt_on_error=1 print_stacktrace=1
        run: >
          ctest --test-dir build -L PBeFS --output-on-failure
          ${{ matrix.tests }}

  # the line coverage of the tests, in Debug and without the sanitizers,
  # sent to Coveralls
  coverage:
    name: Linux coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenmpi-dev openmpi-bin lcov
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-O0 -g --coverage"
          -DCMAKE_EXE_LINKER_FLAGS="--coverage"
          -DCMAKE_SHARED_LINKER_FLAGS="--coverage"
      - name: Build
        run: cmake --build build -j 4
      - name: Test
        run: ctest --test-dir build -L PBeFS --output-on-failure
      - name: Coverage
        run: |
          lcov --capture --directory build --output-file lcov.info \
               --ignore-errors mismatch,inconsistent,unused,negative
          lcov --extract lcov.info "$PWD/include/*" "$PWD/src/*" \
               --output-file lcov.info --ignore-errors unused
      - uses: coverallsapp/github-action@v2
        with:
          file: lcov.info
          fail-on-error: false

  windows:
    name: Windows MSVC
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # the checkout has no tags: the commit takes the version of the recipes,
      # as in a release, which packaging/test asks of the installed package
      - name: Version
        shell: bash
        run: git tag -f "v$(sed -n 's/^pkgver=//p' packaging/aur/PKGBUILD)"
      # FastFlow relies on POSIX, and MPI is left out: the threads and OpenMP
      - name: Configure
        run: >
          cmake -S . -B build -DPBEFS_WITH_FASTFLOW=OFF -DPBEFS_WITH_MPI=OFF
      - name: Build
        run: cmake --build build --config Release -j 4
      - name: Test
        run: >
          ctest --test-dir build -C Release -L PBeFS --output-on-failure
      - name: Install
        shell: bash
        run: |
          p="$RUNNER_TEMP/astar"
          cmake --install build --config Release --prefix "$p"
          # the pkg-config of the runner, if any, is not one for MSVC
          cmake -S packaging/test -B build-use -DCMAKE_PREFIX_PATH="$p" \
                -DCMAKE_DISABLE_FIND_PACKAGE_PkgConfig=ON
          cmake --build build-use --config Release
          ctest --test-dir build-use -C Release --output-on-failure
