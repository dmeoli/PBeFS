% --------------------------------------------------------------------------- %
%    pbefs-manual.cfg                                                         %
%                                                                             %
%    The configuration of tex4ht for the pages of HTML of the manual: one     %
%    page per chapter and per section, the mathematics by MathJax, the        %
%    pictures of TikZ as SVG, and a style sheet close to the one of the PDF.  %
%                                                                             %
%                                Donato Meoli                                 %
%                         Dipartimento di Informatica                         %
%                             Università di Pisa                              %
% --------------------------------------------------------------------------- %
\Preamble{xhtml,mathjax,2,sections+,svg}
\Configure{@HEAD}{\HCode{<meta name="viewport"
  content="width=device-width, initial-scale=1" />\Hnewline}}
\Css{body { max-width: 50em; margin: 0 auto; padding: 0 1em;
  font-family: Georgia, serif; line-height: 1.5; }}
\Css{pre.listings, .lstlisting { font-size: 0.9em; overflow-x: auto; }}
\Css{figure, .figure { text-align: center; }}
\Css{table { margin: 0 auto; }}
\begin{document}
\EndPreamble
% --------------------------------------------------------------------------- %
% -------------------------- END pbefs-manual.cfg --------------------------- %
% --------------------------------------------------------------------------- %
