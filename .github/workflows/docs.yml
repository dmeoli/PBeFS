# --------------------------------------------------------------------------- #
#    Documentation of PBeFS                                                   #
#                                                                             #
#    Builds the documentation and publishes it on the pages of the            #
#    repository at each push to main: the site of Sphinx with the theme of    #
#    Read the Docs, whose pages docs/pages.py writes from the README, the     #
#    design note and the CHANGELOG, and whose API reference docs/apiref.py    #
#    writes from the XML of Doxygen, as a tree of layers, groups, headers     #
#    and classes. A warning of Doxygen fails the build.                       #
#                                                                             #
#                                Donato Meoli                                 #
#                         Dipartimento di Informatica                         #
#                             Universita' di Pisa                             #
# --------------------------------------------------------------------------- #
name: Docs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: the site of Sphinx
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen
          pip install -r docs/requirements.txt
          python3 docs/pages.py
          if [ -s build-docs/doxygen-warnings.log ]; then
            cat build-docs/doxygen-warnings.log
            exit 1
          fi
          sphinx-build -b html docs build-docs/html
          touch build-docs/html/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build-docs/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
